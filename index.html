<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Teacher Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Auth Dialog -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <h2>Welcome Back</h2>
      <p>Log in to manage your classes</p>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUser" class="form-control" placeholder="teacher" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" class="form-control" placeholder="teacher123" required />
        </div>
        <button type="submit" class="btn" style="width: 100%;">Sign In</button>
        <div style="text-align: center; margin-top: 1rem;">
          <a href="#" id="viewAsStudent" style="color: var(--primary); font-size: 0.9rem;">Continue as Student (Read-Only)</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fa-solid fa-graduation-cap"></i> Teacher Hub
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-view="dashboard"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a class="nav-item" data-view="subjects"><i class="fa-solid fa-book"></i> Subjects</a>
        <a class="nav-item" data-view="students"><i class="fa-solid fa-users"></i> Students</a>
        <a class="nav-item" data-view="attendance"><i class="fa-solid fa-clipboard-check"></i> Attendance</a>
        <a class="nav-item" data-view="timetable"><i class="fa-solid fa-calendar-days"></i> Timetable</a>
        <a class="nav-item" data-view="assignments"><i class="fa-solid fa-file-lines"></i> Assignments</a>
        <a class="nav-item" data-view="resources"><i class="fa-solid fa-folder-open"></i> Resources</a>
        <a class="nav-item" data-view="announcements"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
        <a class="nav-item" data-view="whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
      </nav>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <h3 id="currentViewTitle">Dashboard</h3>
        <div class="user-profile">
          <span id="userBadge" class="badge">Teacher</span>
          <button id="logoutBtn" class="btn btn-secondary btn-sm">Switch / Logout</button>
        </div>
      </header>

      <div class="content-area" id="dynamicContent">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>

  <!-- Dynamic Modal for CRUD -->
  <div class="modal" id="crudModal">
    <div class="modal-content">
      <h3 id="modalTitle">Edit Record</h3>
      <form id="modalForm" style="margin-top: 1rem;">
        <div id="modalFormFields"></div>
        <div style="display:flex; justify-content: flex-end; gap: 8px; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
